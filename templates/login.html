<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHMS Central Fleet Portal — Admin Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        card: '#18181c',
                        border: '#27272a',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0f0f12] text-zinc-100 min-h-screen flex items-center justify-center p-4 selection:bg-white selection:text-black">
    <div class="w-full max-w-md">
        <!-- Logo & Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-zinc-900 border border-zinc-800 shadow-2xl mb-4">
                <i data-lucide="shield-check" class="h-7 w-7 text-emerald-400"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">SHMS Central Fleet Portal</h1>
            <p class="text-xs text-zinc-400 mt-1.5 font-medium">Enterprise Surveillance Fleet Control Hub</p>
        </div>

        <!-- Login Card -->
        <div class="bg-[#18181c] border border-zinc-800/90 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div id="errorAlert" class="hidden p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
                    <i data-lucide="alert-circle" class="h-4 w-4 shrink-0"></i>
                    <span id="errorMessage">Invalid credentials</span>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Administrator Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-2.5 h-4 w-4 text-zinc-500"></i>
                        <input 
                            type="text" 
                            id="username" 
                            required 
                            placeholder="admin"
                            value="admin"
                            class="w-full pl-9 pr-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors"
                        />
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-zinc-300">Master Access Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-2.5 h-4 w-4 text-zinc-500"></i>
                        <input 
                            type="password" 
                            id="password" 
                            required 
                            placeholder="••••••••"
                            value="admin123"
                            class="w-full pl-9 pr-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-xs text-white placeholder-zinc-600 focus:outline-none focus:border-zinc-500 transition-colors"
                        />
                    </div>
                </div>

                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full mt-2 py-2.5 px-4 bg-white hover:bg-zinc-200 text-zinc-950 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 shadow-sm"
                >
                    <i data-lucide="log-in" class="h-4 w-4"></i>
                    <span>Sign In to Central Console</span>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-zinc-800/80 text-center">
                <span class="text-[11px] text-zinc-500 font-mono">Default credentials: admin / admin123</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-[11px] text-zinc-600">
            Smart Hotel Monitoring System &bull; Multi-Edge Central Management
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('errorAlert');
            const alertMsg = document.getElementById('errorMessage');
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="h-4 w-4 animate-spin"></i><span>Authenticating...</span>`;
            lucide.createIcons();
            alertBox.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || 'Authentication failed');
                }

                // Redirect to Central Admin Portal
                window.location.href = '/admin';
            } catch (err) {
                alertMsg.innerText = err.message;
                alertBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="log-in" class="h-4 w-4"></i><span>Sign In to Central Console</span>`;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
